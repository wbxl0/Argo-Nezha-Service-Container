<!--
  Nezha /dashboard server list: hide Group and keep the operation column visible.
  v1/v2: paste this whole block into Settings -> Custom Codes Dashboard.
  v0: use the CSS in the dashboard theme/custom CSS injection point.
-->
<style>
/* Nezha v1/v2 server management table (the script below adds this class only on /dashboard) */
table.wb-server-management-table th:last-child,
table.wb-server-management-table td:last-child {
  position: sticky;
  right: 0;
  z-index: 20;
  min-width: 9rem;
  white-space: nowrap;
  background: hsl(var(--background));
  box-shadow: -0.5rem 0 0.75rem -0.75rem hsl(var(--foreground) / 0.8);
}

table.wb-server-management-table tbody tr:hover td:last-child,
table.wb-server-management-table tbody tr[data-state="selected"] td:last-child {
  background: hsl(var(--muted) / 0.5);
}

table.wb-server-management-table th:nth-child(1),
table.wb-server-management-table td:nth-child(1),
table.wb-server-management-table th:nth-child(2),
table.wb-server-management-table td:nth-child(2) {
  max-width: 12rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

table.wb-server-management-table td:last-child > *,
table.wb-server-management-table td:last-child [role="group"] {
  flex-shrink: 0;
}

/* Hide only the backend server table's Group column. */
table.wb-server-management-table .wb-server-group-column {
  display: none;
}

/* Fallback for v2 when custom-code scripts are blocked: the server table has 12 columns. */
@supports selector(table:has(th)) {
  table:has(> thead > tr > th:nth-child(12)) > thead > tr > th:nth-child(4),
  table:has(> thead > tr > th:nth-child(12)) > tbody > tr > td:nth-child(4) {
    display: none;
  }
}

/* Nezha v0 Semantic UI server table */
table.ui.basic.table th:last-child,
table.ui.basic.table td:last-child {
  position: sticky;
  right: 0;
  z-index: 20;
  min-width: 9rem;
  white-space: nowrap;
  background: var(--background, #fff);
  box-shadow: -0.5rem 0 0.75rem -0.75rem rgba(0, 0, 0, 0.45);
}

table.ui.basic.table tr:hover td:last-child {
  background: var(--hover-background, var(--background, #fff));
}

table.ui.basic.table td:nth-child(1),
table.ui.basic.table td:nth-child(2) {
  max-width: 12rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
</style>
<script>
(() => {
  const markerClass = "wb-server-management-table"

  const normalize = (value) => value?.replace(/\s+/g, "").trim().toLowerCase() || ""
  const actionHeaders = new Set(["actions", "action", "操作", "管理"])
  const groupHeaders = new Set(["group", "groups", "分组", "服务器分组"])

  const markServerTable = () => {
    if (!window.location.pathname.startsWith("/dashboard")) return

    document.querySelectorAll("table").forEach((table) => {
      const headerRow = table.querySelector("thead tr") || table.querySelector("tr:has(th)")
      if (!headerRow) return

      const headers = Array.from(headerRow.children).filter((cell) => cell.tagName === "TH")
      const lastHeader = headers.at(-1)
      if (!lastHeader || !actionHeaders.has(normalize(lastHeader.textContent))) return

      table.classList.add(markerClass)

      headers.forEach((header, index) => {
        if (!groupHeaders.has(normalize(header.textContent))) return

        header.classList.add("wb-server-group-column")
        table.querySelectorAll("tr").forEach((row) => {
          const cell = row.children[index]
          if (cell) cell.classList.add("wb-server-group-column")
        })
      })
    })
  }

  markServerTable()
  const start = () => {
    markServerTable()
    new MutationObserver(markServerTable).observe(document.body, {
      childList: true,
      subtree: true,
    })
    window.addEventListener("popstate", markServerTable)
  }

  if (document.body) start()
  else window.addEventListener("DOMContentLoaded", start, { once: true })
})()
</script>
