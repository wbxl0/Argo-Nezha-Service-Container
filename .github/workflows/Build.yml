name: "Build and push images"

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths-ignore:
      - "*.md"

permissions:
  contents: write

jobs:
  Building:
      runs-on: ubuntu-latest
      name: "Build image"
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        DOCKERHUB_REPOSITORY: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:${{ secrets.DOCKER_TAG || 'latest' }}
        IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}

      steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu zip unzip curl
          sudo curl -fsSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          go install github.com/swaggo/swag/cmd/swag@v1.16.6

      - name: Build patched Dashboard binaries
        run: bash build-dashboard.sh

      - name: Publish patched Dashboard release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v2.2.10"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "Patched Nezha Dashboard v2.2.10" \
              --notes "Patched Nezha Dashboard v2.2.10"
          fi

          upload_asset() {
            local file="$1"
            local attempt
            for attempt in 1 2 3 4 5; do
              if gh release upload "$tag" "$file" --clobber; then
                return 0
              fi
              if [ "$attempt" -lt 5 ]; then
                sleep $((attempt * 10))
              fi
            done
            echo "Failed to upload $file after 5 attempts" >&2
            return 1
          }

          upload_asset dist/dashboard-linux-amd64.zip
          upload_asset dist/dashboard-linux-arm64.zip

          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          grep -Fxq 'dashboard-linux-amd64.zip' <<< "$assets"
          grep -Fxq 'dashboard-linux-arm64.zip' <<< "$assets"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0

      - name: Login to DockerHub
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Push images to Docker hub
        uses: docker/build-push-action@v5.1.0
        with:
          push: true
          platforms: linux/amd64, linux/arm64, linux/arm/v7
          tags: ${{ env.DOCKERHUB_REPOSITORY }}
